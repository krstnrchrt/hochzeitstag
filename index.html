<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alles Gute zum Hochzeitstag!</title>
<meta name="description" content="Für Андрей & Ольга – 21. Oktober 1989. Von Euren Kindern.">
<meta property="og:title" content="Alles Gute zum Hochzeitstag! ❤">
<meta property="og:description" content="Für Андрей & Ольга – von Euren Kindern">
<meta name="theme-color" content="#8e1b22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28S4 20 4 11.5C4 7.5 7 5 10.3 5c2.5 0 4.5 1.4 5.7 3.4C17.2 6.4 19.2 5 21.7 5 25 5 28 7.5 28 11.5 28 20 16 28 16 28z' fill='%23d7263d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Marck+Script&family=Press+Start+2P&family=Russo+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1 · Umschlag -->
<section id="intro" class="screen intro">
  <div class="floaters" aria-hidden="true"></div>
  <p class="intro-kicker">Post für</p>
  <h1 class="intro-names" data-fill="names"></h1>
  <button id="envelope" class="envelope" type="button" aria-label="Umschlag öffnen">
    <span class="env-back"></span>
    <span class="env-letter"><span class="env-letter-icon" data-icon="heart"></span>Alles Gute!</span>
    <span class="env-pocket"><span class="env-address"><span data-fill="village"></span> → <span data-fill="city"></span></span></span>
    <span class="env-flap"><span class="env-seal" data-icon="starGold"></span></span>
    <span class="env-stamp"><span class="env-stamp-icon" data-icon="tulip"></span><small>ПОЧТА СССР</small><b>1989</b></span>
    <span class="env-postmark"><span data-fill="villageUpper"></span><br>21·10·89</span>
  </button>
  <p class="intro-hint">Zum Öffnen antippen</p>
</section>

<!-- 2 · Pixel-Geschichte -->
<section id="story" class="screen story" hidden>
  <div class="tv">
    <canvas id="stage" width="160" height="120" role="img"
      aria-label="Pixel-Animation: Hochzeit im Oktober 1989 in Kasachstan, Helena 1991, Kristina 1995, Zugfahrt über Belarus und Berlin nach Düsseldorf, Thomas 2003, heute die ganze Familie."></canvas>
  </div>
  <p id="caption" class="caption" aria-live="polite"></p>
  <button id="skip" class="btn-ghost" type="button">Überspringen ▸▸</button>
</section>

<!-- 3 · Fotofilm -->
<section id="reel" class="screen reel" hidden>
  <div class="reel-frame">
    <div id="reelStage" class="reel-stage"></div>
    <p class="reel-caption"><span data-fill="names"></span> · Sommer 2025</p>
    <div class="reel-progress"><i id="reelBar"></i></div>
  </div>
  <button id="reelSkip" class="btn-ghost" type="button">Weiter ▸▸</button>
</section>

<!-- 4 · Postkarte -->
<section id="card" class="screen card-screen" hidden>
  <div class="count-intro" aria-live="polite">
    <div class="counter counter-big"><b id="countNum">0</b><span>gemeinsame Tage</span></div>
    <p class="count-sub">seit dem 21. Oktober 1989</p>
  </div>
  <article class="postcard">
    <span class="corner tl" data-icon="corner"></span>
    <span class="corner tr" data-icon="corner"></span>
    <span class="corner bl" data-icon="corner"></span>
    <span class="corner br" data-icon="corner"></span>

    <div class="icon-row" aria-hidden="true"></div>
    <p class="kicker">Alles Gute zum</p>
    <h2 class="big"><span data-fill="years"></span>. Hochzeitstag!</h2>
    <p class="names" data-fill="names"></p>
    <p class="dates"><span>21. Oktober 1989</span><span class="dates-heart" data-icon="heart"></span><span>21. Oktober <span data-fill="year"></span></span></p>
    <p class="route">Von <span data-fill="village"></span> bis <span data-fill="city"></span></p>
    <div class="counter"><b data-fill="days"></b><span>gemeinsame Tage</span></div>

    <div class="ornament-line" aria-hidden="true"></div>
    <blockquote id="message" class="message"></blockquote>
    <p class="signature">In Liebe,<br><span data-fill="signature"></span></p>
    <div class="stitch" aria-hidden="true"></div>
  </article>

  <div class="card-actions">
    <button id="replayReel" class="btn btn-gold" type="button" hidden>▶ Fotofilm</button>
    <button id="replay" class="btn" type="button">↻ Alles noch einmal</button>
  </div>
  <footer class="footer">Mit Liebe gemacht · <span data-fill="signatureInline"></span> · <span data-fill="year"></span></footer>
</section>

<button id="musicBtn" class="music-btn" type="button" aria-label="Musik an/aus" hidden>♪</button>
<audio id="music" loop preload="none"></audio>
<div id="confetti" class="confetti" aria-hidden="true"></div>

<script src="config.js"></script>
<script src="photos.js"></script>
<script src="icons.js"></script>
<script src="script.js"></script>
</body>
</html>
